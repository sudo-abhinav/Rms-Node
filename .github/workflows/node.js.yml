name: Node.js CI

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use latest Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest
        cache: 'npm'

    - run: npm ci

    # 🔍 Run Linter
    - name: Run Linter
      run: npm run lint

    # ⚡ Build
    - run: npm run build --if-present

    # ✅ Run Tests
    - run: npm test
